<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>テクテクてんぷる</title>
  <meta name="theme-color" content="#fff4cf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="てんぷる">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <h1 aria-label="テクテクてんぷる"><span>テ</span><span>ク</span><span>テ</span><span>ク</span><span>て</span><span>ん</span><span>ぷ</span><span>る</span></h1>
        <p class="date" id="dateLabel"></p>
      </div>
      <div class="top-buttons">
        <button class="icon-btn" id="openDiary" aria-label="おさんぽ日記">日記</button>
        <button class="icon-btn" id="openSettings" aria-label="せってい">設定</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="sky-deco" id="skyDeco"></div>
      <div class="particles" id="particles"></div>
      <div class="chip" id="dayChip" hidden></div>

      <div class="bubble" id="bubble"><p id="bubbleText"></p></div>

      <button class="cat-btn" id="catBtn" aria-label="なでる">
        <svg class="cat" id="cat" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 線をすこしゆらして手描きっぽくする -->
            <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
              <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/>
              <feDisplacementMap in="SourceGraphic" scale="2.6"/>
            </filter>
            <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
          </defs>
          <g class="pose" id="catPose" filter="url(#wobble)"></g>
          <g class="zzz" id="catZzz"><text x="178" y="72">z</text><text x="192" y="56">z</text></g>
        </svg>
      </button>
      <div class="ground" id="ground"></div>
    </main>

    <section class="card steps-card">
      <p class="card-label">きょうのおさんぽ</p>
      <p class="steps"><span id="stepsNum">—</span><small>歩</small></p>
      <p class="sub" id="stepsSub">ショートカットから歩数を届けてね</p>
    </section>

    <section class="card review-card" id="reviewCard" hidden>
      <p class="card-label">今週のふりかえり</p>
      <div class="week-bars" id="weekBars"></div>
      <p class="sub" id="reviewNote"></p>
    </section>

    <section class="card total-card">
      <p class="card-label">これまで一緒に歩いた道のり</p>
      <p class="total" id="totalKm">0 km</p>
      <p class="sub" id="totalNote"></p>
    </section>
  </div>

  <!-- おさんぽ日記 -->
  <div class="sheet" id="diarySheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <button class="nav" id="prevMonth" aria-label="前の月">‹</button>
        <h2 id="monthLabel"></h2>
        <button class="nav" id="nextMonth" aria-label="次の月">›</button>
      </div>
      <div class="cal-week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div class="cal" id="calendar"></div>
      <p class="sub center" id="monthSum"></p>
      <button class="close" data-close>とじる</button>
    </div>
  </div>

  <!-- せってい -->
  <div class="sheet" id="settingsSheet" hidden>
    <div class="sheet-inner">
      <h2>せってい</h2>
      <label class="field">ねこの名前
        <input id="catName" type="text" maxlength="12" placeholder="てんぷる">
      </label>
      <label class="field">ねこのお誕生日（あれば）
        <input id="catBirthday" type="date">
      </label>
      <hr>
      <p class="field-title">歩数を手で入れる</p>
      <div class="row">
        <input id="manualDate" type="date">
        <input id="manualSteps" type="number" inputmode="numeric" min="0" placeholder="歩数">
        <button class="small" id="manualSave">入れる</button>
      </div>
      <hr>
      <p class="field-title">記録のバックアップ</p>
      <p class="sub">「コピー」を押して、メモ帳アプリなどに貼っておいてください。記録が消えたときは、その文字を下の欄に貼って「もどす」を押します。</p>
      <div class="row">
        <button class="small" id="backupCopy">コピー</button>
        <button class="small ghost" id="backupRestore">もどす</button>
      </div>
      <textarea id="backupText" rows="3" placeholder="ここにバックアップの文字を貼ります"></textarea>
      <hr>
      <p class="field-title">ショートカット用のURL</p>
      <p class="sub">ショートカットの「URLを開く」にはこのURLの後ろに歩数をつけます。</p>
      <code class="url" id="baseUrl"></code>
      <button class="close" data-close>とじる</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="holidays.js"></script>
  <script src="messages.js"></script>
  <script src="poses.js"></script>
  <script src="app.js"></script>
</body>
</html>
